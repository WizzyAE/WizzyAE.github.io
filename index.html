<style>
  :root {
    --bg: #070b18; --panel: #0f172c; --panel-2: #141e38; --line: #1e2a48;
    --text: #eef2ff; --muted: #93a0c4; --faint: #5d6a90; --radius: 20px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); overflow-x: hidden;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Static, unblurred gradients: nothing is repainted while scrolling. */
    background:
      radial-gradient(900px 520px at 10% -10%, rgba(31, 77, 255, .22), transparent 70%),
      radial-gradient(800px 480px at 100% 0%, rgba(229, 23, 66, .16), transparent 70%),
      var(--bg) no-repeat;
  }
  .wrap { width: min(1040px, 100%); margin: 0 auto; padding: 0 16px; }

  nav { border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  nav .wrap { display: flex; align-items: center; gap: 10px; height: 58px; }
  nav img { width: 28px; height: 28px; }
  nav b { font-weight: 800; letter-spacing: .06em; }
  .chip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: #38d98a; }

  header { padding: 48px 0 28px; }
  .hello { color: var(--muted); font-weight: 500; margin: 0 0 6px; }
  .hello:empty { display: none; }
  h1 { margin: 0; font-size: clamp(32px, 7vw, 56px); line-height: 1.05; letter-spacing: -.03em; font-weight: 800; }
  h1 span { background: linear-gradient(100deg, #6c9bff, #c45cff 45%, #ff4d6d 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: 10px 0 0; color: var(--muted); font-size: clamp(15px, 2.2vw, 17px); }

  .apps { display: grid; gap: 16px; padding-bottom: 48px; }
  .app { --accent: #3d7bff; display: grid; grid-template-columns: auto 1fr; gap: 22px; padding: 24px;
    border-radius: var(--radius); border: 1px solid var(--line);
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--panel)), var(--panel) 45%); }
  .icon { width: 88px; height: 88px; border-radius: 22px; }
  .body { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
  .ver { font-size: 12.5px; color: var(--muted); }
  .desc { margin: -6px 0 0; color: var(--muted); }

  .dl { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
  .btn { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; border-radius: 14px;
    color: var(--text); text-decoration: none; background: var(--panel-2); border: 1px solid var(--line);
    -webkit-tap-highlight-color: transparent; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn span { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .btn strong { font-weight: 600; }
  .btn small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn.main { background: var(--accent); border-color: transparent; }
  .btn.main small { color: rgba(255,255,255,.85); }
  .btn:active { opacity: .8; }
  @media (hover: hover) {
    .btn { transition: background-color .15s, filter .15s; }
    .btn:hover { background: #1a2647; }
    .btn.main:hover { background: var(--accent); filter: brightness(1.1); }
  }
  .hint { margin: 0; font-size: 13px; color: var(--muted); }
  .none { margin: 0; font-size: 13.5px; color: var(--faint); }

  details { border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13.5px; font-weight: 500; list-style: none; padding: 4px 0; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "› "; }
  details[open] summary::before { content: "⌄ "; }
  details ul { margin: 6px 0 0; padding-left: 18px; color: #cdd5ef; }
  details li { margin: 4px 0; }
  footer { padding: 0 0 calc(32px + env(safe-area-inset-bottom)); color: var(--faint); font-size: 12.5px; text-align: center; }

  @media (max-width: 640px) {
    header { padding: 32px 0 20px; }
    /* Icon beside the name; everything else full width. */
    .app { grid-template-columns: 56px 1fr; padding: 16px; gap: 12px 14px; }
    .body { display: contents; }
    .body > * { grid-column: 1 / -1; }
    .body > .title { grid-column: 2; align-self: center; flex-direction: column; gap: 0; }
    .desc { margin: 0; }
    .icon { width: 56px; height: 56px; border-radius: 14px; }
    h2 { font-size: 21px; }
    .dl { grid-template-columns: 1fr 1fr; }
    .btn.main { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<nav><div class="wrap"><img src="icons/grom.svg" alt="" width="28" height="28"><b>GROM</b><span class="chip"><i></i><span id="device"></span></span></div></nav>
<main class="wrap">
  <header>
    <p class="hello" id="hello"></p>

  <section class="apps" id="apps"></section>
</main>
<footer class="wrap">GROM</footer>

<script>
const ICONS = {
  windows: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5 10.5 4.4v7.1H3zM11.5 4.3 21 3v8.5h-9.5zM3 12.5h7.5v7.1L3 18.5zM11.5 12.5H21V21l-9.5-1.3z"/></svg>',
  android: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.48 19.44 6.3a.38.38 0 0 0-.66-.38l-1.86 3.22a11.4 11.4 0 0 0-9.84 0L5.22 5.92a.38.38 0 0 0-.66.38L6.4 9.48A10.8 10.8 0 0 0 1 18h22a10.8 10.8 0 0 0-5.4-8.52M7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5m10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5"/></svg>',
  mac: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46a4.2 4.2 0 0 0-3.32-1.8c-1.4-.14-2.75.83-3.46.83-.72 0-1.82-.81-3-.79a4.4 4.4 0 0 0-3.72 2.27c-1.6 2.77-.41 6.86 1.14 9.1.76 1.1 1.66 2.33 2.84 2.29 1.14-.05 1.57-.74 2.95-.74s1.77.74 2.97.71c1.23-.02 2-1.11 2.75-2.22a9.8 9.8 0 0 0 1.25-2.56 3.96 3.96 0 0 1-2.36-3.63M14.1 5.85A3.9 3.9 0 0 0 15 3a4 4 0 0 0-2.6 1.34 3.7 3.7 0 0 0-.93 2.75 3.3 3.3 0 0 0 2.63-1.24"/></svg>'
};
const LABEL = { windows: 'Windows', android: 'Android', mac: 'macOS', ios: 'iPhone / iPad', other: 'računalo' };
const HINT = {
  windows: 'Ako Windows javi upozorenje: Više informacija › Svejedno pokreni.',
  android: 'Kad Android pita, dopusti instalaciju iz ovog preglednika.',
  mac: 'Raspakiraj ZIP i pokreni installer desnim klikom › Otvori.'
};
const KIND = { win32: 'windows', darwin: 'mac', android: 'android', termux: 'android' };

const ua = navigator.userAgent;
const device = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios'
  : /Android/i.test(ua) ? 'android' : /Windows/i.test(ua) ? 'windows' : /Macintosh|Mac OS X/.test(ua) ? 'mac' : 'other';

// Personal link: ?za=Ime. Remembered on this device and removed from the address bar so it is not passed on by accident.
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const params = new URLSearchParams(location.search);
const fromLink = (params.get('za') || '').trim().slice(0, 60);
if (fromLink) { store.set('grom-za', fromLink); params.delete('za'); history.replaceState(null, '', location.pathname + (params.size ? '?' + params : '') + location.hash); }
const who = fromLink || store.get('grom-za') || '';

const config = JSON.parse(document.getElementById('data').textContent);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids.filter(k => k != null && k !== false)); return n; };
const svg = html => { const t = document.createElement('template'); t.innerHTML = html; return t.content.firstChild; };
const size = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.max(1, Math.round(b / 1e6)) + ' MB';
const date = iso => new Date(iso).toLocaleDateString('hr-HR', { day: 'numeric', month: 'long', year: 'numeric' });

function log(entry) {
  if (!config.log) return;
  const body = JSON.stringify({ za: who, uredaj: LABEL[device], preglednik: ua.slice(0, 180), ...entry });
  try { if (!navigator.sendBeacon(config.log, new Blob([body], { type: 'text/plain' }))) throw 0; }
  catch { fetch(config.log, { method: 'POST', mode: 'no-cors', body, keepalive: true }).catch(() => {}); }
}

function card(app) {
  const feed = app.latest;
  const files = feed ? Object.entries(feed.platforms).map(([p, f]) => ({ ...f, kind: KIND[p], termux: p === 'termux' })).filter(f => f.kind) : [];
  files.sort((a, b) => (b.kind === device) - (a.kind === device));
  const mine = files.find(f => f.kind === device);
  const buttons = files.map((f, i) => {
    const extra = [size(f.bytes), f.version !== feed.version ? 'verzija ' + f.version : '', f.termux ? 'Termux' : ''].filter(Boolean).join(' · ');
    const link = el('a', { className: 'btn' + (f === mine || (!mine && i === 0) ? ' main' : ''), href: f.url },
      svg(ICONS[f.kind]), el('span', {}, el('strong', { textContent: LABEL[f.kind] }), el('small', { textContent: extra })));
    link.addEventListener('click', () => log({ radnja: 'preuzimanje', app: app.name, verzija: f.version, platforma: LABEL[f.kind], datoteka: f.name }));
    return link;
  });
  const box = el('article', { className: 'app' },
    el('img', { className: 'icon', src: app.icon || 'icons/grom.svg', alt: '', width: 88, height: 88, decoding: 'async' }),
    el('div', { className: 'body' },
      el('div', { className: 'title' }, el('h2', { textContent: app.name }), el('span', { className: 'ver', textContent: feed ? `${feed.version} · ${date(feed.publishedAt)}` : 'uskoro' })),
      app.desc ? el('p', { className: 'desc', textContent: app.desc }) : null,
      buttons.length ? el('div', { className: 'dl' }, ...buttons) : el('p', { className: 'none', textContent: 'Još nema datoteka za preuzimanje.' }),
      mine && HINT[device] ? el('p', { className: 'hint', textContent: HINT[device] })
        : feed && !mine && device !== 'other' ? el('p', { className: 'none', textContent: `Nema verzije za ${LABEL[device]}.` }) : null,
      feed?.notes?.length ? el('details', {}, el('summary', { textContent: 'Novo u ovoj verziji' }), el('ul', {}, ...feed.notes.map(t => el('li', { textContent: t })))) : null));
  if (app.color) box.style.setProperty('--accent', app.color);
  return box;
}

document.getElementById('device').textContent = LABEL[device];
document.getElementById('hello').textContent = who ? `Bok, ${who}` : '';
document.getElementById('apps').append(...config.apps.map(card));
if (who) { try { if (!sessionStorage.getItem('grom-visit')) { sessionStorage.setItem('grom-visit', '1'); log({ radnja: 'posjet' }); } } catch {} }
</script>
