<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GROM appovi</title>
<link rel="icon" href="icons/grom.svg">
<style>
  :root {
    --bg: #070d1c; --card: #0f1a33; --line: #1d2c50; --text: #e8eefc; --muted: #8b9bc0;
    --accent: #3d7bff; --accent-text: #fff; --soft: #16244a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f6fc; --card: #fff; --line: #dbe3f3; --text: #0b1630; --muted: #5b6b8f; --accent: #2563eb; --soft: #e8eefb; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  header img { width: 40px; height: 40px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .apps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; gap: 14px; align-items: center; }
  .top img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
  .top h2 { font-size: 18px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .desc { margin: 0; color: var(--muted); }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { flex: 1 1 140px; display: flex; flex-direction: column; align-items: center; padding: 10px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; background: var(--soft); color: var(--text); border: 1px solid var(--line); }
  .btn small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .btn.main { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .btn.main small { color: rgba(255,255,255,.8); }
  .btn:hover { filter: brightness(1.1); }
  details { border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details ul { margin: 8px 0 0; padding-left: 18px; }
  details li { margin: 3px 0; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header><img src="icons/grom.svg" alt=""><h1>GROM appovi</h1></header>
  <div class="apps" id="apps"></div>
</main>
<script>
const android = /android/i.test(navigator.userAgent);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids.filter(k => k != null)); return n; };
const size = bytes => bytes >= 1e9 ? (bytes / 1e9).toFixed(1) + ' GB' : Math.round(bytes / 1e6) + ' MB';
const date = iso => new Date(iso).toLocaleDateString('hr-HR', { day: 'numeric', month: 'numeric', year: 'numeric' });
// Same bullet rules as the apps' own "Novo u verziji".
const notes = body => (body || '').split(/\r?\n/).map(l => l.replace(/^\s*(?:[-*•]|\d+\.)\s*/, '').trim()).filter(l => l && !l.startsWith('#')).slice(0, 12);

async function latest(repo) {
  const key = 'rel:' + repo;
  try { const hit = JSON.parse(sessionStorage.getItem(key)); if (hit && Date.now() - hit.at < 600000) return hit.data; } catch {}
  const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' } });
  if (!res.ok) throw new Error(res.status);
  const data = await res.json();
  try { sessionStorage.setItem(key, JSON.stringify({ at: Date.now(), data })); } catch {}
  return data;
}

function button(label, asset, main) {
  return el('a', { className: 'btn' + (main ? ' main' : ''), href: asset.browser_download_url }, label, el('small', { textContent: size(asset.size) }));
}

async function card(app, owner) {
  const repo = app.repo.includes('/') ? app.repo : owner + '/' + app.repo;
  const page = `https://github.com/${repo}/releases/latest`;
  const meta = el('div', { className: 'meta', textContent: 'Učitavam…' });
  const buttons = el('div', { className: 'buttons' });
  const box = el('article', { className: 'app' },
    el('div', { className: 'top' }, el('img', { src: app.icon || 'icons/grom.svg', alt: '' }), el('div', {}, el('h2', { textContent: app.name }), meta)),
    app.desc ? el('p', { className: 'desc', textContent: app.desc }) : null,
    buttons);
  try {
    const rel = await latest(repo);
    meta.textContent = `Verzija ${String(rel.tag_name).replace(/^v/i, '')} · ${date(rel.published_at)}`;
    const exe = rel.assets.find(a => /\.exe$/i.test(a.name)), apk = rel.assets.find(a => /\.apk$/i.test(a.name));
    if (exe) buttons.append(button('Windows', exe, !android));
    if (apk) buttons.append(button('Android', apk, android || !exe));
    if (!exe && !apk) buttons.append(el('a', { className: 'btn main', href: page, textContent: 'Preuzmi' }));
    const list = notes(rel.body);
    if (list.length) box.append(el('details', {}, el('summary', { textContent: 'Novo u ovoj verziji' }), el('ul', {}, ...list.map(t => el('li', { textContent: t })))));
  } catch (e) {
    meta.textContent = String(e.message) === '404' ? 'Još nije objavljeno' : 'GitHub trenutno ne odgovara';
    buttons.append(el('a', { className: 'btn', href: page, textContent: 'Otvori na GitHubu' }));
  }
  return box;
}

(async () => {
  const root = document.getElementById('apps');
  const config = await (await fetch('apps.json', { cache: 'no-store' })).json();
  // On owner.github.io the owner is the hostname; apps.json names it for local previews.
  const owner = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : config.owner;
  if (!config.apps.length) return root.append(el('p', { className: 'empty', textContent: 'Još nema objavljenih appova.' }));
  const cards = await Promise.all(config.apps.map(app => card(app, owner)));
  root.append(...cards);
})();
</script>
</body>
</html>
